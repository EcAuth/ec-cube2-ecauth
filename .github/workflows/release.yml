name: Release

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 配布アーカイブの組み立ては tools/build-archive.sh に一本化する。
      # ここで cp を並べ直すと、プラグインにファイルを追加したときに
      # 追従漏れが起きる（実際、旧実装は現在のディレクトリ構成に追従できて
      # おらず、存在しないパスを cp しようとして失敗する状態だった）。
      - name: Build plugin archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          plugin_version=$(grep -oE "PLUGIN_VERSION\s*=\s*'[^']+'" plugin/EcAuthLogin2/plugin_info.php | sed -E "s/.*'([^']+)'/\1/")

          # タグと plugin_info.php の宣言バージョンがずれたまま公開すると、
          # オーナーズストア側で表示されるバージョンと中身が食い違う。
          if [ "$version" != "$plugin_version" ]; then
            echo "::error::Tag ($version) does not match PLUGIN_VERSION in plugin_info.php ($plugin_version)" >&2
            exit 1
          fi

          ./tools/build-archive.sh "dist/EcAuthLogin2-${TAG_NAME}.tar.gz"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/EcAuthLogin2-${{ github.ref_name }}.tar.gz
