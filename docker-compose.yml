networks:
  backend:
    driver: bridge

volumes:
  pg-database:
    driver: local
  vendor:
    driver: local

services:
  ec-cube:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: /usr/local/bin/ecauth-docker-entrypoint.sh
    command: apache2-foreground
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "28080:80"
      - "8081:443"
    environment:
      TZ: Asia/Tokyo
      PHP_POST_MAX_SIZE: 10M
      PHP_UPLOAD_MAX_FILESIZE: 10M
      PHP_LOG_ERRORS: "On"
      PHP_ERROR_REPORTING: "E_ALL"
      PHP_ERROR_LOG: "/proc/self/fd/2"
      # EC-CUBE2 Config
      HTTP_URL: https://localhost:8081/
      HTTPS_URL: https://localhost:8081/
      ROOT_URLPATH: /
      DOMAIN_NAME: ~
      DB_TYPE: pgsql
      DB_USER: eccube_db_user
      DB_PASSWORD: password
      DB_SERVER: postgres
      DB_NAME: eccube_db
      DB_PORT: 5432
      ADMIN_DIR: ${ADMIN_DIR:-admin/}
      ADMIN_FORCE_SSL: 'false'
      ADMIN_ALLOW_HOSTS: 'a:0:{}'
      AUTH_MAGIC: ~
      PASSWORD_HASH_ALGOS: sha256
      # EcAuth 設定（.env で上書き）
      ECAUTH_CLIENT_ID: ${ECAUTH_CLIENT_ID:-}
      ECAUTH_CLIENT_SECRET: ${ECAUTH_CLIENT_SECRET:-}
      ECAUTH_AUTHORIZATION_ENDPOINT: ${ECAUTH_AUTHORIZATION_ENDPOINT:-}
      ECAUTH_TOKEN_ENDPOINT: ${ECAUTH_TOKEN_ENDPOINT:-}
      ECAUTH_USERINFO_ENDPOINT: ${ECAUTH_USERINFO_ENDPOINT:-}
      ECAUTH_EXTERNAL_USERINFO_ENDPOINT: ${ECAUTH_EXTERNAL_USERINFO_ENDPOINT:-}
      ECAUTH_PROVIDER_NAME: ${ECAUTH_PROVIDER_NAME:-federate-oauth2}
      # EcAuth Base URL として許可するホスト（カンマ区切り）。
      # dev / staging の EcAuth は ec-auth.io 配下に無いため、そこへ繋ぐ場合は
      # ECAUTH_ALLOWED_HOSTS に「完全なホスト名」を足すこと。
      # .azurewebsites.net のようなサフィックス指定にはしないこと。共有ホスティングの
      # サフィックスを許可すると、そのサービスの全利用者を信頼することになり、
      # EcAuthDocs #101 の修正の意味が失われる。
      ECAUTH_ALLOWED_HOSTS: ${ECAUTH_ALLOWED_HOSTS:-.ec-auth.io}
      # 管理画面のパスワード認証を無効化する（開発 / CI 専用の入口）。
      # docker-entrypoint.sh がこの値を見て data/config/config.php へ
      # define('ECAUTH_DISABLE_ADMIN_PASSWORD_LOGIN', true) を追記する。
      # 本番は config.php を直接編集する運用で、この環境変数は使わない。
      ECAUTH_DISABLE_ADMIN_PASSWORD_LOGIN: ${ECAUTH_DISABLE_ADMIN_PASSWORD_LOGIN:-}
      # CI 用フラグ（docker-entrypoint.sh が読む）
      # SKIP_PLUGIN_INSTALL=true で entrypoint のプラグイン CLI 自動インストールを抑止し、
      # Web インストール経路のテスト（e2e-web-install.yml）を可能にする
      SKIP_PLUGIN_INSTALL: ${SKIP_PLUGIN_INSTALL:-}
      ECCUBE_INSTALL_SKIP: ${ECCUBE_INSTALL_SKIP:-}
    volumes:
      - "vendor:/var/www/app/data/vendor"
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:15-alpine
    environment:
      TZ: Asia/Tokyo
      POSTGRES_DB: eccube_db
      POSTGRES_USER: eccube_db_user
      POSTGRES_PASSWORD: password
    ports:
      - "25432:5432"
    volumes:
      - pg-database:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: pg_isready -U eccube_db_user -d eccube_db
      interval: 3s
      timeout: 3s
      retries: 10
